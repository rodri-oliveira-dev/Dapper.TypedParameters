name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Dapper.TypedParameters.sln

      - name: Build
        run: dotnet build Dapper.TypedParameters.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Dapper.TypedParameters.sln --configuration Release --no-build --verbosity normal
